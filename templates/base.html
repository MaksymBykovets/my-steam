<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Steam{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .advanced-filters {
    padding: 22px;
    border-radius: 24px;
    background: rgba(5, 5, 5, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.form-select {
    border-radius: 12px;
}

.filter-pill {
    display: inline-flex;
    align-items: center;
}

        .store-layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    gap: 28px;
    align-items: start;
}

.store-sidebar {
    position: sticky;
    top: 90px;
    min-height: 680px;
    padding: 24px;
    border-radius: 24px;
    background:
        linear-gradient(180deg, rgba(111, 66, 193, 0.22), rgba(13, 110, 253, 0.08)),
        rgba(5, 5, 5, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
}

.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.sidebar-icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    background: linear-gradient(135deg, #0d6efd, #8b5cf6);
    box-shadow: 0 12px 30px rgba(13, 110, 253, 0.35);
}

.sidebar-nav {
    display: grid;
    gap: 10px;
}

.sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 16px;
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    transition: 0.2s ease;
}

.sidebar-link:hover,
.sidebar-link.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
}

.sidebar-divider {
    height: 1px;
    margin: 24px 0;
    background: rgba(255, 255, 255, 0.12);
}

.store-main {
    min-width: 0;
}

.store-topbar {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: center;
    padding: 28px;
    border-radius: 24px;
    background:
        linear-gradient(135deg, rgba(13, 110, 253, 0.16), rgba(111, 66, 193, 0.2)),
        rgba(5, 5, 5, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.store-search {
    display: flex;
    gap: 10px;
    min-width: 360px;
}

.store-filters {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.filter-pill {
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(5, 5, 5, 0.7);
    color: rgba(255, 255, 255, 0.72);
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 600;
    transition: 0.2s ease;
}

.filter-pill:hover,
.filter-pill.active {
    color: #fff;
    border-color: rgba(13, 110, 253, 0.8);
    background: linear-gradient(135deg, #0d6efd, #8b5cf6);
    box-shadow: 0 10px 28px rgba(13, 110, 253, 0.25);
}

.game-card {
    overflow: hidden;
    border-radius: 24px;
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)),
        #050505;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}

.game-card:hover {
    transform: translateY(-6px);
    border-color: rgba(13, 110, 253, 0.75);
    box-shadow:
        0 22px 55px rgba(0, 0, 0, 0.45),
        0 0 35px rgba(13, 110, 253, 0.18);
}

.game-cover {
    position: relative;
    height: 230px;
    background: #6c757d;
    overflow: hidden;
}

.game-cover img {
    transition: transform 0.3s ease;
}

.game-card:hover .game-cover img {
    transform: scale(1.05);
}

.game-cover-placeholder {
    width: 100%;
    height: 100%;
    display: grid;
    place-content: center;
    text-align: center;
    background:
        radial-gradient(circle at center, rgba(111, 66, 193, 0.4), transparent 38%),
        #6c757d;
}

.game-badge {
    position: absolute;
    left: 16px;
    top: 16px;
    max-width: calc(100% - 32px);
    padding: 7px 11px;
    border-radius: 999px;
    background: linear-gradient(135deg, #0d6efd, #8b5cf6);
    color: #fff;
    font-size: 0.78rem;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
}

.game-card-body {
    padding: 20px;
}

.game-title {
    font-weight: 800;
    margin-bottom: 6px;
}

.game-developer {
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 0;
}

.game-price {
    font-size: 1.25rem;
    font-weight: 800;
}

.empty-store {
    padding: 70px 20px;
    text-align: center;
    border-radius: 24px;
    background: rgba(5, 5, 5, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.12);
}

@media (max-width: 992px) {
    .store-layout {
        grid-template-columns: 1fr;
    }

    .store-sidebar {
        position: static;
        min-height: auto;
    }

    .store-topbar {
        flex-direction: column;
        align-items: stretch;
    }

    .store-search {
        min-width: 0;
    }
}
    body {
        background:
            radial-gradient(circle at top left, rgba(83, 52, 131, 0.35), transparent 35%),
            radial-gradient(circle at top right, rgba(13, 110, 253, 0.25), transparent 30%),
            #1f2428;
    }

    .profile-hero {
        background:
            linear-gradient(135deg, rgba(13, 110, 253, 0.35), rgba(111, 66, 193, 0.35)),
            #050505;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .card {
        border-radius: 18px;
    }

    .btn {
        border-radius: 12px;
        font-weight: 600;
    }

    .form-control {
        border-radius: 12px;
    }
</style>
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">My Steam</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'game_list' %}">Games</a>
                </li>

                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'library' %}">Library</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile' %}">Profile</a>
                    </li>

                    <li class="nav-item">
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link nav-link">Logout</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'register' %}">Register</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}
    {% endblock %}
</main>

<footer class="border-top border-secondary py-4 mt-5">
    <div class="container text-center text-secondary">
        My Steam © 2026 — Django game launcher project
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
