{% extends 'base.html' %}

{% block title %}Profile — My Steam{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card bg-black text-light border-secondary shadow">
            <div class="card-body p-4">
                <h1 class="fw-bold mb-3">Profile</h1>

                <p class="text-secondary mb-4">
                    Manage your account information.
                </p>

                <div class="mb-3">
                    <span class="text-secondary">Username:</span>
                    <span class="fw-bold">{{ request.user.username }}</span>
                </div>

                <div class="mb-3">
                    <span class="text-secondary">Email:</span>
                    <span class="fw-bold">{{ request.user.email }}</span>
                </div>

                <a href="{% url 'game_list' %}" class="btn btn-primary mt-3">Browse Games</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
